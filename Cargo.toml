[package]
name = "range-requests"
description = "Various utilities to deal with `Range Requests`"
categories = ["web-programming", "network-programming"]
keywords = ["range-requests", "range", "content-range", "http"]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/M4SS-Code/range-requests"
rust-version = "1.88"


[package.metadata.docs.rs]
features = [
    "axum",
    "multipart",
]
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
axum-core = { version = "0.5", optional = true }
bytes = "1"
http = "1"
http-body = { version = "1", optional = true }
rand = { version = "0.10.4", default-features = false, features = ["thread_rng"], optional = true }
thiserror = "2"

[features]
default = []
axum = ["dep:axum-core"]
multipart = ["dep:http-body", "dep:rand"]
